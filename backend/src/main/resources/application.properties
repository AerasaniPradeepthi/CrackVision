server.port=${PORT:5050}
spring.application.name=CrackVision Backend

spring.datasource.url=${CRACKVISION_DB_URL:jdbc:mysql://${CRACKVISION_DB_HOST}:${CRACKVISION_DB_PORT}/${CRACKVISION_DB_NAME}?ssl-mode=REQUIRED}
spring.datasource.username=${CRACKVISION_DB_USER}
spring.datasource.password=${CRACKVISION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# File Upload Configuration
crackvision.upload.dir=${CRACKVISION_UPLOAD_DIR:uploads/inspections}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Microservice Configuration
crackvision.ai-service.url=${CRACKVISION_AI_SERVICE_URL:http://127.0.0.1:8000}
crackvision.ai-service.connect-timeout-ms=${CRACKVISION_AI_CONNECT_TIMEOUT_MS:5000}
crackvision.ai-service.read-timeout-ms=${CRACKVISION_AI_READ_TIMEOUT_MS:30000}

# JWT Secret Configuration (CRACKVISION_JWT_SECRET environment variable is mandatory in production)
crackvision.jwt.secret=${CRACKVISION_JWT_SECRET:}

# CORS Configuration for Vercel Frontend & Local Development
crackvision.cors.allowed-origins=${CRACKVISION_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
