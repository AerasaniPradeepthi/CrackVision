server.port=${PORT:5050}
spring.application.name=CrackVision Backend

spring.datasource.url=${CRACKVISION_DB_URL:jdbc:mysql://${CRACKVISION_DB_HOST}:${CRACKVISION_DB_PORT}/${CRACKVISION_DB_NAME}?ssl-mode=REQUIRED}
spring.datasource.username=${CRACKVISION_DB_USER}
spring.datasource.password=${CRACKVISION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# File Upload Configuration
crackvision.upload.dir=${CRACKVISION_UPLOAD_DIR:uploads/inspections}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Microservice Configuration
crackvision.ai-service.url=${CRACKVISION_AI_SERVICE_URL:http://127.0.0.1:8000}
crackvision.ai-service.api-key=${CRACKVISION_AI_SERVICE_API_KEY:}
crackvision.ai-service.connect-timeout-ms=${CRACKVISION_AI_CONNECT_TIMEOUT_MS:5000}
crackvision.ai-service.read-timeout-ms=${CRACKVISION_AI_READ_TIMEOUT_MS:30000}

# JWT Secret Configuration (CRACKVISION_JWT_SECRET environment variable is mandatory in production)
crackvision.jwt.secret=${CRACKVISION_JWT_SECRET:}

# CORS Configuration for Vercel Frontend & Local Development
crackvision.cors.allowed-origins=${CRACKVISION_CORS_ALLOWED_ORIGINS:https://crack-vision.vercel.app,https://*.vercel.app,https://crackvision.vercel.app,http://localhost:3000,http://localhost:5173}

# Secure Admin & System Account Initial Provisioning Password
# Must be explicitly configured via CRACKVISION_ADMIN_INITIAL_PASSWORD in Render environment variables.
# When empty, automatic creation of privileged accounts is skipped to prevent default credentials.
crackvision.admin.initial-password=${CRACKVISION_ADMIN_INITIAL_PASSWORD:}

# Cloudinary Storage Configuration (Optional for persistent cloud storage of inspection photos)
crackvision.cloudinary.cloud-name=${CRACKVISION_CLOUDINARY_CLOUD_NAME:}
crackvision.cloudinary.api-key=${CRACKVISION_CLOUDINARY_API_KEY:}
crackvision.cloudinary.api-secret=${CRACKVISION_CLOUDINARY_API_SECRET:}
crackvision.cloudinary.upload-preset=${CRACKVISION_CLOUDINARY_UPLOAD_PRESET:}

