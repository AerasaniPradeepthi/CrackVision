server.port=5050
spring.application.name=CrackVision Backend

spring.datasource.url=jdbc:mysql://${CRACKVISION_DB_HOST}:${CRACKVISION_DB_PORT}/${CRACKVISION_DB_NAME}?ssl-mode=REQUIRED
spring.datasource.username=${CRACKVISION_DB_USER}
spring.datasource.password=${CRACKVISION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.security=DEBUG

# File Upload Configuration
crackvision.upload.dir=uploads/inspections
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AI Microservice Configuration
crackvision.ai-service.url=${CRACKVISION_AI_SERVICE_URL:http://127.0.0.1:8000}
crackvision.ai-service.connect-timeout-ms=${CRACKVISION_AI_CONNECT_TIMEOUT_MS:5000}
crackvision.ai-service.read-timeout-ms=${CRACKVISION_AI_READ_TIMEOUT_MS:30000}
