server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15M;

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API requests to Spring Boot backend
    location /api/ {
        proxy_pass http://backend:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy AI screening highlighted image outputs to FastAPI microservice
    location /outputs/ {
        proxy_pass http://ai-service:8000/outputs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression for production performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
}
