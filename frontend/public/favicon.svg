<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
  <!-- Dark Navy Engineering Blueprint Background -->
  <rect width="48" height="48" rx="10" fill="#0B132B"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="9.25" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid Lines -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#1E293B" stroke-width="0.6" stroke-dasharray="1 3"/>
  <line x1="4" y1="26" x2="44" y2="26" stroke="#1E293B" stroke-width="0.6" stroke-dasharray="1 3"/>

  <!-- Left Architectural Wing -->
  <path d="M11 20L18 16V35H11V20Z" fill="#CBD5E1"/>
  <line x1="14.5" y1="20" x2="14.5" y2="33" stroke="#0B132B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Main High-Rise Center Tower -->
  <path d="M19 12L24 7L29 12V35H19V12Z" fill="#FFFFFF"/>
  <line x1="22.5" y1="13.5" x2="22.5" y2="33" stroke="#0B132B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="25.5" y1="13.5" x2="25.5" y2="33" stroke="#0B132B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right Architectural Wing -->
  <path d="M30 18L37 22V35H30V18Z" fill="#E2E8F0"/>
  <line x1="33.5" y1="21.5" x2="33.5" y2="33" stroke="#0B132B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- CrackVision Detection Scanline -->
  <line x1="8" y1="26" x2="40" y2="26" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <circle cx="24" cy="26" r="1.75" fill="#38BDF8"/>
  <circle cx="24" cy="26" r="3.5" stroke="#38BDF8" stroke-width="0.6" opacity="0.6"/>

  <!-- Structural Civil Engineering Foundation Plinths -->
  <rect x="9" y="36.5" width="30" height="2.5" rx="0.8" fill="#F8FAFC"/>
  <rect x="7" y="40.5" width="34" height="2.5" rx="0.8" fill="#64748B"/>
</svg>