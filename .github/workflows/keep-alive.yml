name: Keep Render Services Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier sleep (sleep timeout is 15 minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health
        run: |
          echo "Pinging CrackVision Backend..."
          curl -s -f --max-time 60 https://crackvision-backend.onrender.com/api/health || echo "Backend pinged"

      - name: Ping AI Service Health
        run: |
          echo "Pinging CrackVision AI Service..."
          curl -s -f --max-time 60 https://crackvision-ai.onrender.com/health || echo "AI service pinged"
